name: Discord compatibility

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Discord release channel to scan
        type: choice
        options: [stable, beta]
        default: stable

permissions:
  contents: read

concurrency:
  group: discord-compat-${{ inputs.channel || 'all' }}

jobs:
  scan:
    name: scan (${{ matrix.channel }})
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.channel) || '["stable","beta"]') }}
    env:
      CHANNEL: ${{ matrix.channel }}
      IOS_SOURCE: ${{ matrix.channel == 'stable' && 'appstore' || 'testflight' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: packages/tools/go.mod
          cache-dependency-path: packages/tools/go.sum
      - name: Download Discord for iOS
        timeout-minutes: 42
        uses: castdrian/dkrypt@90e77358afff7fc913376dd732d30b222f922e0d
        with:
          api-url: ${{ vars.DKRYPT_BASE_URL || 'https://ipa.dylib.dev' }}
          api-key: ${{ secrets.DKRYPT_API_KEY }}
          bundle-id: com.hammerandchisel.discord
          channel: ${{ env.IOS_SOURCE }}
          output: discord.ipa
          timeout-seconds: "1800"
      - name: Restore the previous scan
        run: |
          set -euo pipefail
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow discord-compat.yml --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "compat-$CHANNEL" --dir baseline 2>/dev/null; then
              echo "Using the scan from run $run as the baseline"
              break
            fi
          done
      - name: Scan
        id: scan
        run: |
          set -uo pipefail
          go run ./packages/tools/cmd/astral compat --ipa discord.ipa --channel "$CHANNEL" --baseline baseline/compat.json --results compat.json --report report.md
          status=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "supported=$([ $status -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.scan.outputs.supported == 'true'
        with:
          name: compat-${{ matrix.channel }}
          path: compat.json
          retention-days: 90
      - name: Report an unsupported build
        if: steps.scan.outputs.supported == 'false'
        run: |
          set -euo pipefail
          version=$(jq -r '.version + " (" + .build + ")"' compat.json 2>/dev/null || echo unknown)
          title="compat: Discord $version ($CHANNEL) is not supported"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file report.md
          fi
          exit 1
