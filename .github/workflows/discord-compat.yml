name: Discord compatibility

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Discord release channel to scan (alpha is Android only)
        type: choice
        options: [stable, beta, alpha]
        default: stable

permissions:
  contents: read

concurrency:
  group: discord-compat-${{ inputs.channel || 'all' }}

jobs:
  scan:
    name: scan (${{ matrix.channel }})
    if: inputs.channel != 'alpha'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.channel) || '["stable","beta"]') }}
    env:
      CHANNEL: ${{ matrix.channel }}
      IOS_SOURCE: ${{ matrix.channel == 'stable' && 'appstore' || 'testflight' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: packages/tools/go.mod
          cache-dependency-path: packages/tools/go.sum
      - name: Download Discord for iOS
        timeout-minutes: 42
        uses: castdrian/dkrypt@90e77358afff7fc913376dd732d30b222f922e0d
        with:
          api-url: ${{ vars.DKRYPT_BASE_URL || 'https://ipa.dylib.dev' }}
          api-key: ${{ secrets.DKRYPT_API_KEY }}
          bundle-id: com.hammerandchisel.discord
          channel: ${{ env.IOS_SOURCE }}
          output: discord.ipa
          timeout-seconds: "1800"
      - name: Restore the previous scan
        run: |
          set -euo pipefail
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow discord-compat.yml --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "compat-$CHANNEL" --dir baseline 2>/dev/null; then
              echo "Using the scan from run $run as the baseline"
              break
            fi
          done
      - name: Scan
        id: scan
        run: |
          set +e
          go run ./packages/tools/cmd/astral compat --ipa discord.ipa --channel "$CHANNEL" --baseline baseline/compat.json --results compat.json --report report.md
          status=$?
          set -e
          [ -f report.md ] && cat report.md >> "$GITHUB_STEP_SUMMARY"
          phoenix=$(jq -r '.phoenix // false' compat.json 2>/dev/null || echo false)
          if [ "$status" -eq 0 ]; then
            echo "outcome=supported" >> "$GITHUB_OUTPUT"
          elif [ "$phoenix" = "false" ] && [ -f compat.json ]; then
            echo "outcome=no-phoenix" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Phoenix::$(jq -r '"Discord " + .version + " (" + .build + ")"' compat.json) ships no Phoenix engine"
          else
            echo "outcome=unsupported" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.scan.outputs.outcome == 'supported'
        with:
          name: compat-${{ matrix.channel }}
          path: compat.json
          retention-days: 90
      - name: Report an unsupported build
        if: steps.scan.outputs.outcome == 'unsupported'
        run: |
          set -euo pipefail
          version=$(jq -r '.version + " (" + .build + ")"' compat.json 2>/dev/null || echo unknown)
          [ -f report.md ] || echo "The compat scan failed before writing a report; see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > report.md
          title="compat: Discord $version ($CHANNEL) is not supported"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file report.md
          fi
          exit 1

  android:
    name: android (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.channel) || '["stable","beta","alpha"]') }}
    env:
      CHANNEL: ${{ matrix.channel }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: packages/tools/go.mod
          cache-dependency-path: packages/tools/go.sum
      - name: Select Java 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Scan
        id: scan
        run: |
          set +e
          go run ./packages/tools/cmd/astral android-compat --channel "$CHANNEL" --results android-compat.json --report report.md
          status=$?
          set -e
          [ -f report.md ] && cat report.md >> "$GITHUB_STEP_SUMMARY"
          phoenix=$(jq -r '.phoenix // false' android-compat.json 2>/dev/null || echo false)
          version=$(jq -r '.versionCode // "unknown"' android-compat.json 2>/dev/null || echo unknown)
          missing=$(jq -r '(.missingHookClasses // []) | join(", ")' android-compat.json 2>/dev/null || true)
          if [ -n "$missing" ]; then
            echo "::warning title=Phoenix classes moved::Discord Android $CHANNEL no longer has $missing; update PhoenixClasses.kt"
          fi
          if [ "$status" -eq 0 ]; then
            echo "outcome=supported" >> "$GITHUB_OUTPUT"
          elif [ ! -f android-compat.json ]; then
            echo "outcome=failed" >> "$GITHUB_OUTPUT"
            echo "::warning title=Android scan failed::The $CHANNEL APKs could not be downloaded or verified"
          elif [ "$phoenix" = "false" ]; then
            echo "outcome=no-phoenix" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Phoenix::Discord Android $CHANNEL ($version) ships no Phoenix engine"
          else
            echo "outcome=unsupported" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.scan.outputs.outcome == 'supported'
        with:
          name: android-compat-${{ matrix.channel }}
          path: android-compat.json
          retention-days: 90
      - name: Warn about an unsupported alpha
        if: steps.scan.outputs.outcome == 'unsupported' && matrix.channel == 'alpha'
        run: echo "::warning title=Alpha unsupported::$(jq -r '"Discord Android alpha " + (.versionCode|tostring)' android-compat.json) is not supported; alpha breakages are an early warning"
      - name: Report an unsupported build
        if: steps.scan.outputs.outcome == 'unsupported' && matrix.channel != 'alpha'
        run: |-
          set -euo pipefail
          version=$(jq -r '.versionCode|tostring' android-compat.json)
          title="compat: Discord Android $version ($CHANNEL) is not supported"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file report.md
          fi
          exit 1
