name: Catalog

on:
  push:
    branches: [main]
    paths:
      - "packages/addons/**"
      - "packages/catalog/**"
      - ".github/workflows/catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish the marketplace catalog
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          persist-credentials: false

      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038

      - name: Build the astral CLI
        run: |
          cargo build --quiet -p astral-tools
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - uses: ./.github/actions/site
        with:
          token: ${{ github.token }}

  pages:
    name: Deploy the site
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
