name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: packages/tools/go.mod
          cache-dependency-path: packages/tools/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: tools
        with:
          path: |
            ~/.local/tools
          key: lint-tools-${{ runner.os }}-clang-format-23.1.5-stylua-2.6.0-taplo-0.10.0-luals-3.19.2
      - name: Install tools
        run: |
          tools="$HOME/.local/tools"
          echo "$tools/bin" >> "$GITHUB_PATH"
          echo "$tools/python/bin" >> "$GITHUB_PATH"
          if [ "${{ steps.tools.outputs.cache-hit }}" != "true" ]; then
            mkdir -p "$tools/bin" "$tools/luals"
            python3 -m venv "$tools/python"
            "$tools/python/bin/pip" install --quiet clang-format==23.1.5
            curl -fsSL https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-x86_64.zip -o stylua.zip
            unzip -q stylua.zip -d "$tools/bin"
            chmod +x "$tools/bin/stylua"
            curl -fsSL https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz | gunzip > "$tools/bin/taplo"
            chmod +x "$tools/bin/taplo"
            curl -fsSL https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz | tar -xz -C "$tools/luals"
            ln -sf "$tools/luals/bin/lua-language-server" "$tools/bin/lua-language-server"
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua-check clang libclang-rt-dev libsqlite3-dev libssl-dev
      - run: go run ./packages/tools/cmd/astral lint
      - run: go run ./packages/tools/cmd/astral test
      - name: Fuzz the rewriter
        run: go run ./packages/tools/cmd/astral fuzz --seconds 120
      - name: Benchmark the rewriter
        run: |
          {
            echo "### Rewriter cost per batch"
            echo '```json'
            go run ./packages/tools/cmd/astral bench
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  android-core:
    name: Build the core for Android
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: packages/tools/go.mod
          cache-dependency-path: packages/tools/go.sum
      - run: go run ./packages/tools/cmd/astral android-core --ndk "$ANDROID_NDK_LATEST_HOME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: astral-core-android
          path: packages/core/build/android/*/libastral-core.a

  android-module:
    name: Build the Android module
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: packages/tools/go.mod
          cache-dependency-path: packages/tools/go.sum
      - name: Select Java 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Install Android build tools
        run: sdkmanager "platforms;android-37" "ndk;27.3.13750724" "cmake;3.22.1"
      - run: go run ./packages/tools/cmd/astral android build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: astral-module-android
          path: packages/android/build/astral/astral-module.apk

  package:
    name: Build the package
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: packages/tools/go.mod
          cache-dependency-path: packages/tools/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-${{ github.run_id }}
          restore-keys: theos-${{ runner.os }}-
      - name: Prepare Theos
        run: |
          echo "THEOS=${{ github.workspace }}/theos" >> "$GITHUB_ENV"
          go run ./packages/tools/cmd/astral prepare-theos --theos "${{ github.workspace }}/theos"
      - name: Build
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make -C packages/ios package FINALPACKAGE=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: astral-deb
          path: packages/ios/packages/*.deb
