name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          persist-credentials: false

      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: astral
          cache-targets: false

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba

      - name: Build the astral CLI
        run: |
          cargo build --quiet -p astral-tools
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: tools
        with:
          path: |
            ~/.local/tools
          key: lint-tools-${{ runner.os }}-clang-format-23.1.5-stylua-2.6.0-taplo-0.10.0-luals-3.19.2-zizmor-1.33.1-yamlfmt-0.21.0-actionlint-1.7.12

      - name: Install tools
        env:
          CACHE_HIT: ${{ steps.tools.outputs.cache-hit }}
        run: |
          tools="$HOME/.local/tools"
          echo "$tools/bin" >> "$GITHUB_PATH"
          echo "$tools/python/bin" >> "$GITHUB_PATH"
          if [ "$CACHE_HIT" != "true" ]; then
            mkdir -p "$tools/bin" "$tools/luals"
            python3 -m venv "$tools/python"
            "$tools/python/bin/pip" install --quiet clang-format==23.1.5 zizmor==1.33.1
            curl -fsSL https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-x86_64.zip -o stylua.zip
            unzip -q stylua.zip -d "$tools/bin"
            chmod +x "$tools/bin/stylua"
            curl -fsSL https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz | gunzip > "$tools/bin/taplo"
            chmod +x "$tools/bin/taplo"
            curl -fsSL https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz | tar -xz -C "$tools/luals"
            ln -sf "$tools/luals/bin/lua-language-server" "$tools/bin/lua-language-server"
            curl -fsSL https://github.com/google/yamlfmt/releases/download/v0.21.0/yamlfmt_0.21.0_Linux_x86_64.tar.gz | tar -xz -C "$tools/bin" yamlfmt
            curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz -C "$tools/bin" actionlint
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua-check clang libclang-rt-dev libsqlite3-dev libssl-dev

      - name: Install Rust lint tools
        run: rustup component add clippy rustfmt

      - run: astral lint

      - run: astral test

  android-core:
    name: Build the native library for Android
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          persist-credentials: false

      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: astral
          cache-targets: false

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba

      - name: Build the astral CLI
        run: |
          cargo build --quiet -p astral-tools
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - name: Install the Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - run: astral android-core --ndk "$ANDROID_NDK_LATEST_HOME"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: astral-native-android
          path: packages/android/build/native/*/libastral.so

  android-module:
    name: Build the Android module
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          persist-credentials: false

      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: astral
          cache-targets: false

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba

      - name: Build the astral CLI
        run: |
          cargo build --quiet -p astral-tools
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - name: Select Java 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-37.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Install the Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - run: astral android build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: astral-module-android
          path: packages/android/build/astral/astral-module.apk

  package:
    name: Build the iOS tweak
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: astral
          cache-targets: false

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba

      - name: Build the astral CLI
        run: |
          cargo build --quiet -p astral-tools
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-${{ github.run_id }}
          restore-keys: theos-${{ runner.os }}-

      - name: Install the Rust iOS target
        run: rustup target add aarch64-apple-ios

      - name: Prepare Theos
        run: |
          echo "THEOS=${{ github.workspace }}/theos" >> "$GITHUB_ENV"
          astral prepare-theos --theos "${{ github.workspace }}/theos"

      - name: Build
        run: |
          gnubin="$(brew --prefix make)/libexec/gnubin"
          export PATH="$gnubin:$PATH"
          make -C packages/ios package FINALPACKAGE=1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: astral-deb
          path: packages/ios/packages/*.deb

  safari-extension:
    name: Build the Safari extension
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: astral
          cache-targets: false

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba

      - name: Check extension JavaScript and locale data
        run: |
          find 'packages/ios/extensions/OpenInAstral/OpenInAstral Extension/Resources' -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 -m json.tool 'packages/ios/extensions/OpenInAstral/OpenInAstral Extension/Resources/_locales/en/messages.json' > /dev/null

      - name: Build extension
        run: |-
          xcodebuild -quiet \
            -project 'packages/ios/extensions/OpenInAstral/OpenInAstral.xcodeproj' \
            -target OpenInAstral \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/OpenInAstralBuild" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build
          test -d "$RUNNER_TEMP/OpenInAstralBuild/OpenInAstral.appex"
