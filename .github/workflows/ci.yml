name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install tools
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pip install --quiet clang-format==23.1.5
          curl -fsSL https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-x86_64.zip -o stylua.zip
          unzip -q stylua.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/stylua"
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64 -o "$HOME/.local/bin/shfmt"
          chmod +x "$HOME/.local/bin/shfmt"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua-check shellcheck clang
      - run: tools/lint.sh
      - run: tools/test.sh

  package:
    name: Build the package
    if: github.event_name == 'push'
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: Randomblock1/theos-action@v1
      - name: Build
        run: |
          brew install make
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make -C packages/loader-ios package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: astral-deb
          path: packages/loader-ios/packages/*.deb
