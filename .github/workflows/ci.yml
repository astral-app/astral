name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: packages/tools/go.mod
          cache-dependency-path: packages/tools/go.sum
      - name: Install tools
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pip install --quiet clang-format==23.1.5
          curl -fsSL https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-x86_64.zip -o stylua.zip
          unzip -q stylua.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/stylua"
          curl -fsSL https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz | gunzip > "$HOME/.local/bin/taplo"
          chmod +x "$HOME/.local/bin/taplo"
          mkdir -p "$HOME/.local/luals"
          curl -fsSL https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz | tar -xz -C "$HOME/.local/luals"
          ln -s "$HOME/.local/luals/bin/lua-language-server" "$HOME/.local/bin/lua-language-server"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua-check clang libclang-rt-dev
      - run: go run ./packages/tools/cmd/astral lint
      - run: go run ./packages/tools/cmd/astral test
      - name: Fuzz the rewriter
        run: go run ./packages/tools/cmd/astral fuzz --seconds 120
      - name: Benchmark the rewriter
        run: |
          {
            echo "### Rewriter cost per batch"
            echo '```json'
            go run ./packages/tools/cmd/astral bench
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Build the package
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: packages/tools/go.mod
          cache-dependency-path: packages/tools/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-${{ github.run_id }}
          restore-keys: theos-${{ runner.os }}-
      - name: Prepare Theos
        run: |
          echo "THEOS=${{ github.workspace }}/theos" >> "$GITHUB_ENV"
          go run ./packages/tools/cmd/astral prepare-theos --theos "${{ github.workspace }}/theos"
      - name: Build
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make -C packages/loader-ios package FINALPACKAGE=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: astral-deb
          path: packages/loader-ios/packages/*.deb
