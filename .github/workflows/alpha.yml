name: Alpha

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "version.txt"
      - ".github/workflows/alpha.yml"
      - ".github/workflows/artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/artifacts.yml
    with:
      android_channel: alpha
      package_suffix: ~alpha.${{ github.run_number }}
    secrets:
      DKRYPT_API_KEY: ${{ secrets.DKRYPT_API_KEY }}

  publish:
    name: Publish the pre-release and feeds
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artifacts

      - name: Build the astral CLI
        run: |
          cargo build --quiet -p astral-tools
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - name: Create the pre-release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat version.txt)
          tag="v${version}-alpha.${GITHUB_RUN_NUMBER}"
          mkdir -p assets
          deb=$(find artifacts/astral-deb -name '*.deb' | head -1)
          cp "$deb" "assets/astral-${version}-alpha.${GITHUB_RUN_NUMBER}-iphoneos-arm64.deb"
          cp artifacts/astral-ipa/astral.ipa "assets/astral-${version}-alpha.${GITHUB_RUN_NUMBER}.ipa"
          cp artifacts/astral-android/astral-module.apk assets/
          (cd artifacts/astral-android/sideload && zip -q "$GITHUB_WORKSPACE/assets/astral.apks" ./*.apk)
          changes="$(astral release-notes)"
          notes="Alpha build from $(git rev-parse --short HEAD). Pre-release: may break.

          ${changes}

          - iOS: sideload the IPA, add the AltStore source https://astral-app.github.io/astral/app-repo.json, or add the APT repo https://astral-app.github.io/astral/repo/ on a jailbroken device.
          - Android: install astral.apks with SAI or another split installer, or the module APK with LSPosed."
          gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" --title "astral ${version} alpha ${GITHUB_RUN_NUMBER}" --notes "$notes"
          gh release upload "$tag" assets/*
          gh release edit "$tag" --draft=false
          ipa="assets/astral-${version}-alpha.${GITHUB_RUN_NUMBER}.ipa"
          {
            echo "tag=$tag"
            echo "ipa=$ipa"
            echo "ipa_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$(basename "$ipa")"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/site
        with:
          token: ${{ github.token }}
          ipa: ${{ steps.release.outputs.ipa }}
          ipa-url: ${{ steps.release.outputs.ipa_url }}
          description: astral ${{ steps.release.outputs.version }} alpha ${{ github.run_number }}

  pages:
    name: Deploy the feeds
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
