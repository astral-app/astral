name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: packages/tools/go.mod
          cache-dependency-path: packages/tools/go.sum

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-${{ github.run_id }}
          restore-keys: theos-${{ runner.os }}-

      - name: Install the Rust iOS target
        run: rustup target add aarch64-apple-ios

      - name: Prepare Theos
        run: |
          echo "THEOS=${{ github.workspace }}/theos" >> "$GITHUB_ENV"
          go run ./packages/tools/cmd/astral prepare-theos --theos "${{ github.workspace }}/theos"

      - name: Build
        run: |
          gnubin="$(brew --prefix make)/libexec/gnubin"
          export PATH="$gnubin:$PATH"
          make -C packages/ios package FINALPACKAGE=1

      - name: Record provenance
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail
          cd packages/ios/packages
          shasum -a 256 -- *.deb > SHA256SUMS
          jq -n \
            --arg tag "$TAG" \
            --arg commit "$GITHUB_SHA" \
            --arg repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --arg workflow "$GITHUB_WORKFLOW_REF" \
            --arg runner "$RUNNER_OS $RUNNER_ARCH $ImageOS $ImageVersion" \
            --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile sums SHA256SUMS \
            '{tag: $tag, source: {repository: $repository, commit: $commit}, builder: {workflow: $workflow, run: $run, runner: $runner}, built: $built,
              artifacts: ($sums | split("\n") | map(select(length > 0) | split("  ") | {name: .[1], sha256: .[0]}))}' > provenance.json

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: packages/ios/packages/*.deb

      - name: Attach the package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |-
          gh release upload "$TAG" packages/ios/packages/*.deb packages/ios/packages/SHA256SUMS packages/ios/packages/provenance.json --clobber
