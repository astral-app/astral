[package]
name = "astral-tools"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
name = "astral_tools"
path = "cli/lib.rs"

[[bin]]
name = "astral"
path = "cli/main.rs"

[dependencies]
astral-core = { path = "../core" }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[profile.release]
strip = true
