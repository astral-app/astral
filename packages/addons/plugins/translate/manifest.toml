id = "astral.translate"
name = "Translate"
description = "Translates a message from its long-press menu with Unbound Translate, Google or MyMemory, into a toast or under the message."
version = "0.0.2"
icon = "LanguageIcon"
main = "main.lua"
permissions = [
	"discord.messages",
	"discord.messages.content",
	"network",
	"storage",
	"ui.clipboard",
	"messages.display",
	"ui.message_actions",
	"ui.toasts",
	"ui.web_auth",
]

