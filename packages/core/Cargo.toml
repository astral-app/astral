[package]
name = "astral-core"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
name = "astral_core"
crate-type = ["staticlib", "rlib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
debug = false
strip = "debuginfo"

[dependencies]
libc = "0.2"
regex-lite = "0.1"
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
