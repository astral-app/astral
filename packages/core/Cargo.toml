[package]
name = "astral-core"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
name = "astral_core"
path = "lib.rs"
crate-type = ["staticlib", "rlib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
debug = false
strip = "debuginfo"

[dependencies]
libc = "0.2"
regex-lite = "0.1"
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
serde = { version = "1.0.229", features = ["derive"] }

[lints.rust]
nonstandard_style = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
cast_lossless = "deny"
enum_glob_use = "deny"
many_single_char_names = "deny"
match_same_arms = "deny"
min_ident_chars = "deny"
needless_pass_by_value = "deny"
redundant_else = "deny"
struct_field_names = "deny"
unreadable_literal = "deny"
wildcard_imports = "deny"
