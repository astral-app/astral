[astral]
version = "0.0.1"

[compatibility]
passive = []

[[plugins]]
id = "astral.reviewdb"
name = "ReviewDB"
version = "0.0.1"
description = "Reads and writes ReviewDB reviews of people with /reviews and /review, or from a message's long-press menu."
icon = "StarIcon"
base = "plugins/astral.reviewdb/"

[[plugins]]
id = "astral.always-animate"
name = "Always Animate"
version = "0.0.1"
description = "Animates avatars, server icons, banners and emoji everywhere, not only when you tap them."
icon = "ReactionIcon"
base = "plugins/astral.always-animate/"

[[plugins]]
id = "astral.local-notifications"
name = "Local Notifications"
version = "0.0.1"
description = "Notifies you of mentions and DMs on installs where Discord's push notifications don't arrive, by keeping Discord connected in the background."
icon = "BellIcon"
base = "plugins/astral.local-notifications/"

[[plugins]]
id = "astral.preview-message"
name = "Preview Message"
version = "0.0.1"
description = "Adds a button to the chat input that shows how your message will look before you send it."
icon = "ChatDotsIcon"
base = "plugins/astral.preview-message/"

[[plugins]]
id = "astral.message-link-embeds"
name = "Message Link Embeds"
version = "0.0.1"
description = "Adds a preview under messages that link to other Discord messages, and opens the linked message when tapped."
icon = "LinkIcon"
base = "plugins/astral.message-link-embeds/"

[[plugins]]
id = "astral.gif-provider-switcher"
name = "GIF Provider Switcher"
version = "0.0.1"
description = "Searches GIFs from Tenor or Giphy instead of Klipy in Discord's own GIF picker."
icon = "ReactionIcon"
base = "plugins/astral.gif-provider-switcher/"

[[plugins]]
id = "astral.cross-mod-badges"
name = "Cross Mod Badges"
version = "0.0.1"
description = "Shows the badges people have from other client mods, such as Vencord, Aliucord and BetterDiscord, on their profile."
icon = "UserCircleIcon"
base = "plugins/astral.cross-mod-badges/"

[[plugins]]
id = "astral.pronoundb"
name = "PronounDB"
version = "0.0.1"
description = "Shows people's pronouns from PronounDB beside their name in messages."
icon = "UserCircleIcon"
base = "plugins/astral.pronoundb/"

[[plugins]]
id = "astral.declutter"
name = "Declutter"
version = "0.0.1"
description = "Hides buttons, upsells and profile decorations you never use: the gift button, Server Boosts, call buttons, avatar decorations, nameplates, server tags and more."
icon = "EyeSlashIcon"
base = "plugins/astral.declutter/"

[[plugins]]
id = "astral.message-logger"
name = "Message Logger"
version = "0.0.1"
description = "Keeps deleted messages in the chat in red and shows what edited messages said before."
icon = "EyeSlashIcon"
base = "plugins/astral.message-logger/"

[[plugins]]
id = "astral.channel-typing-indicators"
name = "Channel Typing Indicators"
version = "0.0.1"
description = "Shows typing dots beside channels where people are typing."
icon = "ChatDotsIcon"
base = "plugins/astral.channel-typing-indicators/"

[[plugins]]
id = "astral.message-latency"
name = "Message Latency"
version = "0.0.1"
description = "Marks messages that took at least the selected time to send, beside their timestamp."
icon = "BellIcon"
base = "plugins/astral.message-latency/"

[[plugins]]
id = "astral.new-member-sprout"
name = "New Member Sprout"
version = "0.0.1"
description = "Shows desktop's new member sprout beside people who joined the server in the last week."
icon = "UserPlusIcon"
base = "plugins/astral.new-member-sprout/"

[[plugins]]
id = "astral.force-owner-crown"
name = "Force Owner Crown"
version = "0.0.1"
description = "Always show the owner crown on the server owner's messages."
icon = "CrownIcon"
base = "plugins/astral.force-owner-crown/"

[[plugins]]
id = "astral.new-user-sprout"
name = "New User Sprout"
version = "0.0.1"
description = "Shows a sprout beside people whose Discord account is less than the chosen number of days old."
icon = "UserPlusIcon"
base = "plugins/astral.new-user-sprout/"

[[plugins]]
id = "astral.view-raw"
name = "View Raw"
version = "0.0.1"
description = "Shows a message's raw data and content in a reply only you can see, ready to copy."
icon = "TextIcon"
base = "plugins/astral.view-raw/"

[[plugins]]
id = "astral.no-reply-mention"
name = "No Reply Mention"
version = "0.0.1"
description = "Turns off the reply ping by default, or only pings the people you list."
icon = "ArrowAngleLeftUpIcon"
base = "plugins/astral.no-reply-mention/"

[[plugins]]
id = "astral.tone-indicators"
name = "Tone Indicators"
version = "0.0.1"
description = "Turns tone tags such as /j and /srs into pills that spell out what they mean."
icon = "TextIcon"
base = "plugins/astral.tone-indicators/"

[[plugins]]
id = "astral.message-text-size"
name = "Message Text Size"
version = "0.0.1"
description = "Makes the text of chat messages bigger or smaller, leaving the rest of Discord as it is."
icon = "TextIcon"
base = "plugins/astral.message-text-size/"

[[plugins]]
id = "astral.debug"
name = "Debug"
version = "0.0.1"
description = "Adds /debug, which posts a status card with astral's versions, device details and plugin states, for support."
icon = "BugIcon"
base = "plugins/astral.debug/"

[[plugins]]
id = "astral.chat-bubbles"
name = "Chat Bubbles"
version = "0.0.2"
description = "Draws a rounded bubble behind each message's text, media and embeds."
icon = "ChatDotsIcon"
base = "plugins/astral.chat-bubbles/"

[[plugins]]
id = "astral.clear-urls"
name = "Clear URLs"
version = "0.0.1"
description = "Removes common tracking parameters from links before messages are sent or edited."
icon = "LinkIcon"
base = "plugins/astral.clear-urls/"

[[plugins]]
id = "astral.text-replace"
name = "Text Replace"
version = "0.0.1"
description = "Rewrites outgoing message text with literal or Lua pattern rules."
icon = "TextIcon"
base = "plugins/astral.text-replace/"

[[plugins]]
id = "astral.mention-haptics"
name = "Mention Haptics"
version = "0.0.2"
description = "Taps your phone when a new message mentions you, your roles or everyone, or arrives in a direct message."
icon = "BellIcon"
base = "plugins/astral.mention-haptics/"

[[plugins]]
id = "astral.enhanced-blocking"
name = "Enhanced Blocking"
version = "0.0.2"
description = "Hides messages by user, keyword or reply author, including people you blocked, edits and messages already loaded."
icon = "EyeSlashIcon"
base = "plugins/astral.enhanced-blocking/"

[[plugins]]
id = "astral.highlight-replies"
name = "Highlight Replies"
version = "0.0.1"
description = "Tints the text of messages that reply to your messages."
icon = "ArrowAngleLeftUpIcon"
base = "plugins/astral.highlight-replies/"

[[plugins]]
id = "astral.translate"
name = "Translate"
version = "0.0.2"
description = "Translates a message from its long-press menu with Unbound Translate, Google or MyMemory, into a toast or under the message."
icon = "LanguageIcon"
base = "plugins/astral.translate/"

[[plugins]]
id = "astral.live-markdown"
name = "Live Markdown"
version = "0.0.1"
description = "Styles Discord markdown as you type in the message composer."
icon = "TextIcon"
base = "plugins/astral.live-markdown/"

[[plugins]]
id = "astral.more-user-tags"
name = "More User Tags"
version = "0.0.2"
description = "Adds tags for webhooks and moderative roles, and can show each member's top coloured role."
base = "plugins/astral.more-user-tags/"

[[plugins]]
id = "astral.show-me-your-name"
name = "Show Me Your Name"
version = "0.0.1"
description = "Display usernames next to display names, or show usernames only."
base = "plugins/astral.show-me-your-name/"

[[plugins]]
id = "astral.settings-theme"
name = "Settings Theme"
version = "0.0.1"
description = "Shows your theme behind User Settings and every page in it, which Discord leaves plain."
icon = "PaintPaletteIcon"
base = "plugins/astral.settings-theme/"

[[plugins]]
id = "astral.mention-avatars"
name = "Mention Avatars"
version = "0.0.1"
description = "Shows user avatars and role icons inside mentions."
icon = "UserCircleIcon"
base = "plugins/astral.mention-avatars/"

[[plugins]]
id = "astral.role-color-everywhere"
name = "Role Color Everywhere"
version = "0.0.1"
description = "Colors mentions, message text, role headers and names beside avatars with members' role colors."
icon = "PaintPaletteIcon"
base = "plugins/astral.role-color-everywhere/"

[[plugins]]
id = "astral.typing-avatars"
name = "Typing Avatars"
version = "0.0.1"
description = "Shows the avatar of each person typing in front of their name."
icon = "UserCircleIcon"
base = "plugins/astral.typing-avatars/"

[[plugins]]
id = "astral.reaction-avatars"
name = "Reaction Avatars"
version = "0.0.1"
description = "Shows the people who reacted beside each message reaction."
icon = "ReactionIcon"
base = "plugins/astral.reaction-avatars/"

[[themes]]
id = "mana"
name = "Mana"
version = "0.0.2"
description = "Teal accents and cool text"
base = "themes/mana.toml"

[[themes]]
id = "ember"
name = "Ember"
version = "0.0.2"
description = "Warm amber accents"
base = "themes/ember.toml"

[[themes]]
id = "soft"
name = "Soft"
version = "0.0.2"
description = "Rounder corners and slightly larger text"
base = "themes/soft.toml"
