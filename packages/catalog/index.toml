[astral]
version = "0.0.1"

[compatibility]
passive = []

[[plugins]]
id = "astral.chat-bubbles"
name = "Chat Bubbles"
version = "0.0.2"
description = "Draws a rounded bubble behind each message's text, media and embeds."
icon = "ChatDotsIcon"
base = "plugins/astral.chat-bubbles/"

[[plugins]]
id = "astral.clear-urls"
name = "Clear URLs"
version = "0.0.1"
description = "Removes common tracking parameters from links before messages are sent or edited."
icon = "LinkIcon"
base = "plugins/astral.clear-urls/"

[[plugins]]
id = "astral.text-replace"
name = "Text Replace"
version = "0.0.1"
description = "Rewrites outgoing message text with literal or Lua pattern rules."
icon = "TextIcon"
base = "plugins/astral.text-replace/"

[[plugins]]
id = "astral.mention-haptics"
name = "Mention Haptics"
version = "0.0.2"
description = "Taps your phone when a new message mentions you, your roles or everyone, or arrives in a direct message."
icon = "BellIcon"
base = "plugins/astral.mention-haptics/"

[[plugins]]
id = "astral.enhanced-blocking"
name = "Enhanced Blocking"
version = "0.0.2"
description = "Hides messages by user, keyword or reply author, including people you blocked, edits and messages already loaded."
icon = "EyeSlashIcon"
base = "plugins/astral.enhanced-blocking/"

[[plugins]]
id = "astral.highlight-replies"
name = "Highlight Replies"
version = "0.0.1"
description = "Tints the text of messages that reply to your messages."
icon = "ArrowAngleLeftUpIcon"
base = "plugins/astral.highlight-replies/"

[[plugins]]
id = "astral.translate"
name = "Translate"
version = "0.0.2"
description = "Translates a message from its long-press menu with Unbound Translate, Google or MyMemory, into a toast or under the message."
icon = "LanguageIcon"
base = "plugins/astral.translate/"

[[plugins]]
id = "astral.live-markdown"
name = "Live Markdown"
version = "0.0.1"
description = "Styles Discord markdown as you type in the message composer."
icon = "TextIcon"
base = "plugins/astral.live-markdown/"

[[plugins]]
id = "astral.more-user-tags"
name = "More User Tags"
version = "0.0.2"
description = "Adds tags for webhooks and moderative roles, and can show each member's top coloured role."
base = "plugins/astral.more-user-tags/"

[[plugins]]
id = "astral.show-me-your-name"
name = "Show Me Your Name"
version = "0.0.1"
description = "Display usernames next to display names, or show usernames only."
base = "plugins/astral.show-me-your-name/"

[[plugins]]
id = "astral.settings-theme"
name = "Settings Theme"
version = "0.0.1"
description = "Shows your theme behind User Settings and every page in it, which Discord leaves plain."
icon = "PaintPaletteIcon"
base = "plugins/astral.settings-theme/"

[[plugins]]
id = "astral.mention-avatars"
name = "Mention Avatars"
version = "0.0.1"
description = "Shows user avatars and role icons inside mentions."
icon = "UserCircleIcon"
base = "plugins/astral.mention-avatars/"

[[plugins]]
id = "astral.role-color-everywhere"
name = "Role Color Everywhere"
version = "0.0.1"
description = "Colors mentions, message text, role headers and names beside avatars with members' role colors."
icon = "PaintPaletteIcon"
base = "plugins/astral.role-color-everywhere/"

[[plugins]]
id = "astral.typing-avatars"
name = "Typing Avatars"
version = "0.0.1"
description = "Shows the avatar of each person typing in front of their name."
icon = "UserCircleIcon"
base = "plugins/astral.typing-avatars/"

[[plugins]]
id = "astral.reaction-avatars"
name = "Reaction Avatars"
version = "0.0.1"
description = "Shows the people who reacted beside each message reaction."
icon = "ReactionIcon"
base = "plugins/astral.reaction-avatars/"

[[themes]]
id = "mana"
name = "Mana"
version = "0.0.2"
description = "Teal accents and cool text"
base = "themes/mana.toml"

[[themes]]
id = "ember"
name = "Ember"
version = "0.0.2"
description = "Warm amber accents"
base = "themes/ember.toml"

[[themes]]
id = "soft"
name = "Soft"
version = "0.0.2"
description = "Rounder corners and slightly larger text"
base = "themes/soft.toml"
