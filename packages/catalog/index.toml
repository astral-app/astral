[astral]
version = "0.0.1"

[compatibility]
passive = []

[[plugins]]
id = "astral.more-user-tags"
name = "More User Tags"
version = "0.0.1"
description = "Adds tags for webhooks and moderative roles, and can show each member's top coloured role."
base = "plugins/astral.more-user-tags/"

[[plugins]]
id = "astral.show-me-your-name"
name = "Show Me Your Name"
version = "0.0.1"
description = "Display usernames next to display names, or show usernames only."
base = "plugins/astral.show-me-your-name/"

[[plugins]]
id = "astral.settings-theme"
name = "Settings Theme"
version = "0.0.1"
description = "Shows your theme behind User Settings and every page in it, which Discord leaves plain."
base = "plugins/astral.settings-theme/"

[[plugins]]
id = "astral.mention-avatars"
name = "Mention Avatars"
version = "0.0.1"
description = "Shows user avatars and role icons inside mentions."
base = "plugins/astral.mention-avatars/"

[[plugins]]
id = "astral.role-color-everywhere"
name = "Role Color Everywhere"
version = "0.0.1"
description = "Colors mentions, message text, role headers and names beside avatars with members' role colors."
base = "plugins/astral.role-color-everywhere/"

[[plugins]]
id = "astral.typing-avatars"
name = "Typing Avatars"
version = "0.0.1"
description = "Shows the avatar of each person typing in front of their name."
base = "plugins/astral.typing-avatars/"

[[plugins]]
id = "astral.reaction-avatars"
name = "Reaction Avatars"
version = "0.0.1"
description = "Shows the people who reacted beside each message reaction."
base = "plugins/astral.reaction-avatars/"

[[themes]]
id = "mana"
name = "Mana"
version = "0.0.2"
description = "Teal accents and cool text"
base = "themes/mana.toml"

[[themes]]
id = "ember"
name = "Ember"
version = "0.0.2"
description = "Warm amber accents"
base = "themes/ember.toml"

[[themes]]
id = "soft"
name = "Soft"
version = "0.0.2"
description = "Rounder corners and slightly larger text"
base = "themes/soft.toml"
