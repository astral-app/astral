<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
</head>
<body>
    <div class="settings">
        <div class="setting-item">
            <label>
                <input type="checkbox" id="showBanner">
                Show open in astral banner
            </label>
        </div>

        <div class="setting-item">
            <label>
                <input type="checkbox" id="instantOpen">
                Open Discord links immediately
            </label>
        </div>

        <div class="setting-item">
            <label>astral URL scheme:</label>
            <input type="text" id="urlScheme" value="astral">
        </div>

        <h4>Enable URL Types:</h4>
        <div class="setting-item">
            <label>
                <input type="checkbox" id="enableInvites">
                Invite links
            </label>
        </div>
        <div class="setting-item">
            <label>
                <input type="checkbox" id="enableUsers">
                User profiles
            </label>
        </div>
        <div class="setting-item">
            <label>
                <input type="checkbox" id="enableChannels">
                Channel links
            </label>
        </div>
        <div class="setting-item">
            <label>
                <input type="checkbox" id="enableFavorites">
                Favorite links
            </label>
        </div>

        <div class="copyright">astral</div>
    </div>
</body>
</html>
